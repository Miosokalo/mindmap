<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mindmap</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">Mindmap</div>
      <div class="actions">
        <button type="button" id="add-child">Kind</button>
        <button type="button" id="relayout" title="Unterpunkte des gewählten Knotens neu anordnen">Anordnen</button>
        <button type="button" id="delete-node">Löschen</button>
        <button type="button" id="download-image" title="Karte als PNG herunterladen">Bild</button>
        <button type="button" id="chat-toggle" title="Assistenten öffnen">Chat</button>
      </div>
      <div class="styles">
        <label>
          Farbe
          <select id="style-color">
            <option value="color">Bunt</option>
            <option value="mono">Schwarz-Weiß</option>
          </select>
        </label>
        <label>
          Linien
          <select id="style-line">
            <option value="curve">Geschwungen</option>
            <option value="straight">Gerade</option>
            <option value="elbow">Abgewinkelt</option>
          </select>
        </label>
        <label title="Gilt nur für den gewählten Knoten. Für die ganze Karte zuerst den Ursprung wählen.">
          Anordnung
          <select id="style-layout">
            <option value="continue">Weiter</option>
            <option value="around">Rundherum</option>
            <option value="horizontal">Links–Rechts</option>
            <option value="vertical">Oben–Unten</option>
            <option value="radial">Gleichmäßig</option>
          </select>
        </label>
        <label>
          Knoten
          <select id="style-nodes">
            <option value="mixed">Gemischt</option>
            <option value="filled">Fläche</option>
            <option value="outline">Rahmen</option>
            <option value="text">Nur Text</option>
          </select>
        </label>
      </div>
      <p class="hint">Anordnung gilt für den gewählten Knoten · Ursprung ordnet die ganze Karte · Tab Kind</p>
    </header>
    <main id="viewport">
      <div id="world">
        <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes"></div>
      </div>
    </main>
    <aside id="chat" hidden>
      <div class="chat-head">
        <span class="chat-title">Assistent</span>
        <span id="chat-model" class="chat-model"></span>
        <button type="button" id="chat-auth" title="Zugang für bessere Modelle">Schlüssel</button>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <textarea id="chat-input" rows="2" placeholder="z. B. Füge unter der Wurzel einen Knoten ‚Wetter‘ an"></textarea>
        <button type="submit" id="chat-send">Senden</button>
      </form>
    </aside>
    <script src="js/pflanzenschutz.js?v=20"></script>
    <script src="js/layout.js?v=20"></script>
    <script src="js/app.js?v=20"></script>
    <script src="js/chat.js?v=21"></script>
  </body>
</html>
